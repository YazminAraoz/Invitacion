  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yazmín & Gonzalo - Save the Date</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg-cream: #FAF6EE;
      --midnight: #0B1626;
      --midnight-light: #182B45;
      --gold: #C5A059;
      --gold-light: #E0C078;
      --border-gold: rgba(197, 160, 89, 0.4);
      --font-display: 'Cinzel Decorative', serif;
      --font-heading: 'Cinzel', serif;
      --font-body: 'Cormorant Garamond', serif;
    }
    body {
      background-color: var(--bg-cream);
      color: var(--midnight);
      font-family: var(--font-body);
      font-size: 18px;
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
    }
    body.envelope-open { overflow-y: auto; }

    /* Pantalla Inicial con fondo.png y sombras 3D */
    #envelopeOverlay {
      position: fixed; inset: 0; z-index: 1000;
      background-image: linear-gradient(rgba(11, 22, 38, 0.8), rgba(11, 22, 38, 0.9)), url('fondo.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 20px; transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    #envelopeOverlay.opened { opacity: 0; visibility: hidden; pointer-events: none; }

    /* Estructura del Sobre 3D con Sombras Realistas */
    .envelope-container {
      width: 100%; max-width: 420px; height: 340px;
      background-image: url('fondo.png');
      background-size: cover;
      background-position: center;
      border: none;
      position: relative;
      box-shadow: 
        0 35px 70px rgba(0, 0, 0, 0.75), 
        0 15px 25px rgba(0, 0, 0, 0.5),
        inset 0 0 40px rgba(0, 0, 0, 0.4);
      border-radius: 8px;
      overflow: visible;
    }

    .envelope-container::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(0, 0, 0, 0.35) 100%);
      pointer-events: none;
      border-radius: 8px;
      z-index: 2;
    }

    .envelope-pocket {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 210px;
      background-image: url('fondo.png');
      background-size: cover;
      background-position: bottom;
      border-top: none;
      z-index: 2;
      border-radius: 0 0 8px 8px;
      box-shadow: inset 0 15px 15px -10px rgba(0, 0, 0, 0.6);
      filter: brightness(0.85);
      pointer-events: none;
    }
