<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yazmín & Gonzalo - Save the Date</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@600;700&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    /* ==========================================
       RESET & BASE STYLES
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-cream: #FAF6EE;
      --bg-cream-dark: #F0E8D8;
      --midnight: #0B1626;
      --midnight-light: #182B45;
      --gold: #C5A059;
      --gold-light: #E0C078;
      --border-gold: rgba(197, 160, 89, 0.4);
      --font-display: 'Cinzel Decorative', serif;
      --font-heading: 'Cinzel', serif;
      --font-body: 'Cormorant Garamond', serif;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--midnight);
      font-family: var(--font-body);
      font-size: 18px;
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100dvh;
      position: relative;
    }

    /* Floating Music Controls */
    .audio-control {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 999;
      background: var(--midnight);
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 8px 14px;
      border-radius: 20px;
      font-family: var(--font-heading);
      font-size: 0.75rem;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(11, 22, 38, 0.2);
    }

    /* ==========================================
       ENVELOPE OVERLAY (SCREEN 1 - HIDDEN INVITATION)
       ========================================== */
    #envelopeOverlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background-color: var(--midnight);
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(24, 43, 69, 0.8) 0%, rgba(11, 22, 38, 1) 80%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      transition: opacity 1.2s ease-in-out, visibility 1.2s ease-in-out;
    }

    #envelopeOverlay.opened {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .envelope-wrapper {
      width: 100%;
      max-width: 380px;
      background: var(--bg-cream);
      border: 2px solid var(--gold);
      padding: 30px 20px;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      text-align: center;
      position: relative;
    }

    .celestial-svg {
      width: 110px;
      height: 110px;
      margin: 0 auto 15px auto;
      display: block;
    }

    .envelope-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: var(--midnight);
      margin-bottom: 5px;
    }

    .envelope-subtitle {
      font-family: var(--font-heading);
      font-size: 0.85rem;
      letter-spacing: 2px;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 25px;
    }

    .wax-seal-btn {
      background: var(--midnight);
      border: 2px solid var(--gold);
      color: var(--gold-light);
      width: 75px;
      height: 75px;
      border-radius: 50%;
      margin: 0 auto;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 15px rgba(11, 22, 38, 0.4);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .wax-seal-btn:hover, .wax-seal-btn:active {
      transform: scale(1.08);
      border-color: var(--gold-light);
    }

      font-size: 0.65rem;
