<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yazmín & Gonzalo - Save the Date</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@600;700&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg-cream: #FAF6EE;
      --midnight: #0B1626;
      --midnight-light: #182B45;
      --gold: #C5A059;
      --gold-light: #E0C078;
      --border-gold: rgba(197, 160, 89, 0.4);
      --font-display: 'Cinzel Decorative', serif;
      --font-heading: 'Cinzel', serif;
      --font-body: 'Cormorant Garamond', serif;
    }
    body {
      background-color: var(--bg-cream);
      color: var(--midnight);
      font-family: var(--font-body);
      font-size: 18px;
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
    }
    body.envelope-open { overflow-y: auto; }

    /* Overlay inicial */
    #envelopeOverlay {
      position: fixed; inset: 0; z-index: 1000;
      background-image: linear-gradient(rgba(11, 22, 38, 0.8), rgba(11, 22, 38, 0.9)), url('fondo.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 20px; transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    #envelopeOverlay.opened { opacity: 0; visibility: hidden; pointer-events: none; }

    /* Contenedor del Sobre (Permite que la tarjeta sobresalga sin cortarse) */
    .envelope-container {
      width: 100%; max-width: 420px; height: 280px;
      position: relative;
      perspective: 1000px;
      margin-top: 50px;
    }

    /* Fondo posterior del sobre */
    .envelope-back {
      position: absolute; inset: 0;
      background-image: url('fondo.png');
      background-size: cover;
      background-position: center;
      border-radius: 8px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
      filter: brightness(0.7);
      z-index: 1;
    }

    /* Tarjeta Interior (Completamente oculta adentro antes del clic) */
    .envelope-card-preview {
      position: absolute; inset: 12px;
      background-image: url('letter.jpg');
      background-size: cover;
      background-position: center;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center; padding: 20px;
      z-index: 2;
      border-radius: 6px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transform: translateY(0);
      opacity: 0;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
      pointer-events: none;
    }
    .envelope-container.open .envelope-card-preview {
      transform: translateY(-110px); /* Sube suavemente por encima del sobre */
      opacity: 1;
    }

    /* Bolsillo Frontal del Sobre */
    .envelope-pocket {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 180px;
      background-image: url('fondo.png');
      background-size: cover;
      background-position: bottom;
      z-index: 3;
      border-radius: 0 0 8px 8px;
      box-shadow: inset 0 15px 15px -10px rgba(0, 0, 0, 0.6);
      filter: brightness(0.9);
      pointer-events: none;
      clip-path: polygon(0 0, 50% 35px, 100% 0, 100% 100%, 0 100%);
    }

    /* Solapa Superior del Sobre */
    .envelope-flap {
      position: absolute; top: 0; left: 0; width: 100%; height: 150px;
      background-image: url('fondo.png');
      background-size: cover;
      background-position: top;
      clip-path: polygon(0 0, 50% 100%, 100% 0);
      transform-origin: top;
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 4;
      filter: brightness(0.95);
      pointer-events: none;
    }
    .envelope-container.open .envelope-flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    /* Botón Sello de Cera con waxseal.png */
    .wax-seal-btn {
      position: absolute; top: 105px; left: 50%; transform: translateX(-50%);
      background-color: transparent;
      background-image: url('waxseal.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border: none;
      width: 105px; height: 105px;
      border-radius: 50%;
      cursor: pointer;
      display: flex; justify-content: center; align-items: center;
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.7));
      z-index: 20;
      transition: transform 0.3s ease, opacity 0.4s ease;
    }
    .wax-seal-btn:hover { transform: translateX(-50%) scale(1.08); }
    .wax-seal-btn span {
      font-family: var(--font-heading);
      font-size: 0.7rem;
      letter-spacing: 2px;
      color: var(--gold-light);
      font-weight: bold;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
      pointer-events: none;
    }
    .envelope-container.open .wax-seal-btn {
      opacity: 0;
      pointer-events: none;
    }

    /* Contenido Principal de la Invitación */
    #mainInvitation { max-width: 680px; margin: 0 auto; padding: 40px 20px; display: none; }
    #mainInvitation.visible { display: block; }

    .section-card {
      background: #FFFFFF; border: 1px solid var(--border-gold);
      padding: 30px 20px; margin-bottom: 35px; border-radius: 4px; text-align: center; position: relative;
      box-shadow: 0 4px 20px rgba(11, 22, 38, 0.04);
      opacity: 0; transform: translateY(30px);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .section-card.reveal {
      animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    .section-card:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(197, 160, 89, 0.15); }

    .header-names { font-family: var(--font-display); font-size: 2.2rem; color: var(--midnight); line-height: 1.2; margin-bottom: 10px; }
    .header-ampersand { font-family: var(--font-body); font-style: italic; color: var(--gold); display: block; font-size: 1.8rem; }
    .storybook-quote { font-style: italic; font-size: 1.15rem; color: var(--midnight-light); margin: 20px 0; line-height: 1.5; padding: 0 15px; }
    .event-date-large { font-family: var(--font-heading); font-size: 1.4rem; color: var(--midnight); letter-spacing: 1px; margin-top: 15px; font-weight: 600; }
    .event-time { font-family: var(--font-heading); font-size: 1rem; color: var(--gold); letter-spacing: 2px; }

    .timer-grid { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
    .timer-box { background: var(--bg-cream); border: 1px solid var(--border-gold); padding: 10px 12px; min-width: 65px; border-radius: 4px; }
    .timer-num { font-family: var(--font-heading); font-size: 1.3rem; color: var(--midnight); font-weight: 700; display: block; }
    .timer-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--gold); }

    .btn-gothic {
      display: inline-block; background: var(--midnight); color: var(--gold-light);
      border: 1px solid var(--gold); padding: 12px 24px; font-family: var(--font-heading);
      font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase; text-decoration: none;
      cursor: pointer; margin-top: 15px; border-radius: 2px; width: 100%; max-width: 300px;
      transition: background 0.3s ease, transform 0.2s ease;
    }
    .btn-gothic:hover { background: var(--midnight-light); color: #FFFFFF; transform: translateY(-2px); }
    .btn-secondary { background: transparent; color: var(--midnight); border: 1px solid var(--midnight); margin-top: 10px; }

    .form-group { text-align: left; margin-bottom: 20px; }
