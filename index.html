<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yazmín & Gonzalo - Save the Date</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@600;700&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg-cream: #FAF6EE;
      --midnight: #0B1626;
      --midnight-light: #182B45;
      --gold: #C5A059;
      --gold-light: #E0C078;
      --border-gold: rgba(197, 160, 89, 0.4);
      --font-display: 'Cinzel Decorative', serif;
      --font-heading: 'Cinzel', serif;
      --font-body: 'Cormorant Garamond', serif;
    }
    body {
      background-color: var(--bg-cream);
      color: var(--midnight);
      font-family: var(--font-body);
      font-size: 18px;
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100dvh;
      position: relative;
    }
    body.envelope-open { overflow-y: auto; }

    .audio-control {
      position: fixed; top: 15px; right: 15px; z-index: 999;
      background: var(--midnight); border: 1px solid var(--gold);
      color: var(--gold); padding: 8px 14px; border-radius: 20px;
      font-family: var(--font-heading); font-size: 0.75rem; letter-spacing: 1px;
      cursor: pointer; display: flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 12px rgba(11, 22, 38, 0.2);
    }

    #envelopeOverlay {
      position: fixed; inset: 0; z-index: 1000;
      background-color: var(--midnight);
      background-image: radial-gradient(circle at 50% 30%, rgba(24, 43, 69, 0.9) 0%, rgba(11, 22, 38, 1) 80%);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 20px; transition: opacity 1.2s ease-in-out, visibility 1.2s ease-in-out;
      perspective: 1000px;
    }
    #envelopeOverlay.opened { opacity: 0; visibility: hidden; pointer-events: none; display: none !important; }

    .old-envelope {
      width: 100%; max-width: 380px;
      background: #F4EEDD;
      border: 2px solid var(--gold);
      padding: 40px 20px 30px 20px;
      border-radius: 4px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
      text-align: center;
      position: relative;
      background-image: radial-gradient(rgba(197, 160, 89, 0.15) 1px, transparent 0);
      background-size: 16px 16px;
      transform-style: preserve-3d;
      transition: transform 0.8s ease;
    }

    .envelope-flap {
      position: absolute; top: 0; left: 0; right: 0; height: 110px;
      background: #EADFB8;
      border-bottom: 2px solid var(--gold);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 10;
    }

    .old-envelope.unfolding .envelope-flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .celestial-svg { width: 90px; height: 90px; margin: 15px auto 10px auto; display: block; position: relative; z-index: 5; }
    .envelope-title { font-family: var(--font-display); font-size: 1.5rem; color: var(--midnight); margin-bottom: 5px; position: relative; z-index: 5; }
