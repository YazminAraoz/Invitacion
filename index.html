<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yazmín & Gonzalo - Save the Date</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@600;700&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg-cream: #FAF6EE;
      --midnight: #0B1626;
      --midnight-light: #182B45;
      --gold: #C5A059;
      --gold-light: #E0C078;
      --border-gold: rgba(197, 160, 89, 0.4);
      --font-display: 'Cinzel Decorative', serif;
      --font-heading: 'Cinzel', serif;
      --font-body: 'Cormorant Garamond', serif;
    }
    body {
      background-color: var(--bg-cream);
      color: var(--midnight);
      font-family: var(--font-body);
      font-size: 18px;
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
    }
    body.envelope-open { overflow-y: auto; }

    /* Pantalla Inicial con fondo.png y sombras 3D */
    #envelopeOverlay {
      position: fixed; inset: 0; z-index: 1000;
      background-image: linear-gradient(rgba(11, 22, 38, 0.8), rgba(11, 22, 38, 0.9)), url('fondo.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 20px; transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    #envelopeOverlay.opened { opacity: 0; visibility: hidden; pointer-events: none; }

    /* Estructura del Sobre 3D con Sombras Realistas */
    .envelope-container {
      width: 100%; max-width: 420px; height: 340px;
      background-image: url('fondo.png');
      background-size: cover;
      background-position: center;
      border: none;
      position: relative;
      box-shadow: 
        0 35px 70px rgba(0, 0, 0, 0.75), 
        0 15px 25px rgba(0, 0, 0, 0.5),
        inset 0 0 40px rgba(0, 0, 0, 0.4);
      border-radius: 8px;
      overflow: visible;
    }

    .envelope-container::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(0, 0, 0, 0.35) 100%);
      pointer-events: none;
      border-radius: 8px;
      z-index: 2;
    }

    .envelope-pocket {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 210px;
      background-image: url('fondo.png');
      background-size: cover;
      background-position: bottom;
      border-top: none;
      z-index: 2;
      border-radius: 0 0 8px 8px;
      box-shadow: inset 0 15px 15px -10px rgba(0, 0, 0, 0.6);
      filter: brightness(0.85);
      pointer-events: none;
    }

    .envelope-flap {
      position: absolute; top: 0; left: 0; width: 100%; height: 160px;
      background-image: url('fondo.png');
      background-size: cover;
      background-position: top;
      clip-path: polygon(0 0, 50% 100%, 100% 0);
      border-bottom: none;
      transform-origin: top;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 4;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
      filter: brightness(0.95);
      pointer-events: none;
    }
    .envelope-container.open .envelope-flap {
      transform: rotateX(180deg);
      z-index: 0;
      box-shadow: none;
    }

    /* Sello de Cera con tu imagen waxseal.png de fondo */
    .wax-seal-btn {
      position: absolute; top: 135px; left: 50%; transform: translateX(-50%);
      background-image: url('waxseal.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border: 2px solid var(--gold); color: var(--gold-light);
      width: 80px; height: 80px; border-radius: 50%; cursor: pointer;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8), inset 0 3px 6px rgba(255, 255, 255, 0.3), inset 0 -4px 6px rgba(0, 0, 0, 0.6);
      z-index: 10;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.3s ease;
    }
    .wax-seal-btn:hover { transform: translateX(-50%) scale(1.12); filter: brightness(1.15); }
    .wax-seal-btn span { font-family: var(--font-heading); font-size: 0.65rem; letter-spacing: 1px; margin-top: 2px; font-weight: bold; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

    /* Tarjeta interior utilizando letter.jpg como fondo */
    .envelope-card-preview {
      position: absolute; inset: 15px; 
      background-image: url('letter.jpg');
      background-size: cover;
      background-position: center;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center; padding: 25px;
      z-index: 1; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      border-radius: 4px;
      pointer-events: none;
    }
    .envelope-container.open .envelope-card-preview {
      transform: translateY(-55px);
      z-index: 3;
    }

    /* Contenido Principal de la Invitación */
    #mainInvitation { max-width: 680px; margin: 0 auto; padding: 40px 20px; display: none; }
    #mainInvitation.visible { display: block; }

    .section-card {
      background: #FFFFFF; border: 1px solid var(--border-gold);
      padding: 30px 20px; margin-bottom: 35px; border-radius: 4px; text-align: center; position: relative;
      box-shadow: 0 4px 20px rgba(11, 22, 38, 0.04);
      opacity: 0; transform: translateY(30px);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .section-card.reveal {
      animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    .section-card:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(197, 160, 89, 0.15); }

    .header-names { font-family: var(--font-display); font-size: 2.2rem; color: var(--midnight); line-height: 1.2; margin-bottom: 10px; }
    .header-ampersand { font-family: var(--font-body); font-style: italic; color: var(--gold); display: block; font-size: 1.8rem; }
    .storybook-quote { font-style: italic; font-size: 1.15rem; color: var(--midnight-light); margin: 20px 0; line-height: 1.5; padding: 0 15px; }
