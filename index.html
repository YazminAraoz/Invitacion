<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyYvRx2KOdwJB92-G2ybahXxcF4BiNYcHEkGEiBWl86B6S92yl9DMGfG96eeJf9o-8b9g/exec";
    const WHATSAPP_PHONE = "353892564030";

    let mediaRecorder = null, audioChunks = [], audioBase64Data = null, audioFileExt = "webm", isRecording = false;

    function openEnvelope() {
      document.getElementById('envelopeOverlay').classList.add('opened');
      document.getElementById('mainInvitation').classList.add('visible');
      document.body.classList.add('envelope-open');
      startCountdown();
    }

    function startCountdown() {
      const targetDate = new Date('September 4, 2027 12:45:00').getTime();
      setInterval(() => {
        const now = new Date().getTime(), diff = targetDate - now;
        if (diff <= 0) return;
        document.getElementById('dias').textContent = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
        document.getElementById('horas').textContent = String(Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
        document.getElementById('minutos').textContent = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
        document.getElementById('segundos').textContent = String(Math.floor((diff % (1000 * 60)) / 1000)).padStart(2, '0');
      }, 1000);
    }

    function openMap() { window.open('https://maps.google.com/?q=25+de+Mayo+1696,+Burzaco,+Buenos+Aires', '_blank'); }
    function addToCalendar() { window.open("https://calendar.google.com/calendar/render?action=TEMPLATE&text=Boda+Yazmin+y+Gonzalo&dates=20270904T154500Z/20270904T210000Z", '_blank'); }

    function updateGuestFields() {
      const count = parseInt(document.getElementById('guests').value, 10);
      const container = document.getElementById('guestNamesContainer');
      container.innerHTML = '';
      for (let i = 1; i <= count; i++) {
        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'form-control guest-name-field';
        input.placeholder = `Nombre y Apellido Acompañante ${i}`;
        input.required = true;
        container.appendChild(input);
      }
    }

    async function toggleRecording() {
      const btn = document.getElementById('recordBtn');
      const status = document.getElementById('recStatus');

      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
          mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.readAsDataURL(audioBlob);
            reader.onloadend = () => { audioBase64Data = reader.result.split(',')[1]; };
            document.getElementById('audioPreview').src = URL.createObjectURL(audioBlob);
            document.getElementById('audioPreview').style.display = 'block';
          };

          mediaRecorder.start();
          isRecording = true;
          btn.textContent = "⏹ Detener Grabación";
          btn.classList.add('recording');
          status.textContent = "Grabando...";
        } catch (err) {
          alert("Error: No se pudo acceder al micrófono.");
        }
      } else {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
        isRecording = false;
        btn.textContent = "🎤 Grabar Nuevamente";
        btn.classList.remove('recording');
        status.textContent = "¡Audio grabado con éxito!";
      }
    }

    async function handleRSVP(event) {
      event.preventDefault();
      const statusDiv = document.getElementById('statusMessage');
      statusDiv.style.color = "var(--midnight)";
      statusDiv.textContent = "Enviando confirmación y abriendo WhatsApp...";

      const name = document.getElementById('fullName').value.trim();
      const attending = document.getElementById('attending').value;
      const guestsCount = parseInt(document.getElementById('guests').value, 10);
      const phone = `+${document.getElementById('countryCode').value}${document.getElementById('phoneNumber').value.trim()}`;
      const dietary = document.getElementById('dietary').value.trim() || "Ninguna";
      const musicLink = document.getElementById('musicLink').value.trim() || "-";
      const commentsInput = document.getElementById('comments').value.trim() || "-";

      const guestInputs = document.querySelectorAll('.guest-name-field');
      let guestNames = [];
      guestInputs.forEach(input => { if (input.value.trim()) guestNames.push(input.value.trim()); });
      const formattedGuestNames = guestNames.length > 0 ? guestNames.join(', ') : "-";

      const now = new Date();
      const payload = {
        Fecha: `${now.toLocaleDateString()} ${now.toLocaleTimeString()}`,
        Nombre: name,
        Asistencia: attending,
        Acompañantes: guestsCount,
        NombresAcompanantes: formattedGuestNames,
        Telefono: phone,
        Restricciones: dietary,
        Musica: musicLink,
        Comentarios: commentsInput,
        audioBase64: audioBase64Data || "",
        audioFileName: audioBase64Data ? `audio_${name.replace(/\s+/g, '_')}.webm` : ""
      };

      // 1. Envío a Google Sheets en segundo plano
      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.error("Error al guardar en Sheets:", err);
      }

      // 2. Construcción del mensaje de WhatsApp
      let msg = `*CONFIRMACIÓN DE ASISTENCIA*\n*Nombre:* ${name}\n*¿Asiste?:* ${attending}\n*Acompañantes:* ${guestsCount}`;
      if (guestNames.length > 0) msg += ` (${formattedGuestNames})`;
      msg += `\n*Teléfono:* ${phone}\n*Restricciones:* ${dietary}`;
      if (musicLink !== "-") msg += `\n*Música sugerida:* ${musicLink}`;
      if (commentsInput !== "-") msg += `\n*Comentarios:* ${commentsInput}`;
      if (audioBase64Data) msg += `\n*(Audio adjuntado en la nube)*`;

      // 3. Redirección inmediata (Incompatible con bloqueadores de ventanas emergentes)
      const waUrl = `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(msg)}`;
      window.location.href = waUrl;
    }
  </script>
