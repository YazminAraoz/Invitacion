<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yazmín & Gonzalo - Save the Date</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@600;700&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg-cream: #FAF6EE;
      --midnight: #0B1626;
      --midnight-light: #182B45;
      --gold: #C5A059;
      --gold-light: #E0C078;
      --border-gold: rgba(197, 160, 89, 0.4);
      --font-display: 'Cinzel Decorative', serif;
      --font-heading: 'Cinzel', serif;
      --font-body: 'Cormorant Garamond', serif;
    }
    body {
      background-color: var(--bg-cream);
      color: var(--midnight);
      font-family: var(--font-body);
      font-size: 18px;
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
    }
    body.envelope-open { overflow-y: auto; }

    /* ==========================================
       0. FENAQUISTISCOPIO A PANTALLA COMPLETA
    ========================================== */
    #phenakistiscopeOverlay {
      position: fixed; inset: 0; z-index: 2000;
      width: 100vw; height: 100vh;
      background: #000000;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      overflow: hidden; cursor: pointer;
      transition: opacity 0.8s ease, visibility 0.8s ease, transform 0.8s ease;
    }
    #phenakistiscopeOverlay.zoom-out {
      transform: scale(2.5);
      opacity: 0;
    }
    #phenakistiscopeOverlay.hidden {
      opacity: 0; visibility: hidden; pointer-events: none;
    }

    /* Vista Fenaquistiscopio Gigante */
    .phena-stage {
      position: relative;
      width: min(95vw, 95vh);
      height: min(95vw, 95vh);
      display: flex; justify-content: center; align-items: center;
    }

    /* Imagen del Fenaquistiscopio Nítida y Gigante */
    .phena-wheel {
      width: 100%; height: 100%;
      border-radius: 50%;
      background-image: url('Fenaquistiscopio.png');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      animation: spinPhenakistiscope 6s linear infinite;
      filter: drop-shadow(0 0 25px rgba(0,0,0,0.9));
    }

    /* Pin/Eje central minimalista */
    .phena-pin {
      position: absolute; width: 35px; height: 35px;
      background: radial-gradient(circle, #E0C078 20%, #C5A059 70%, #0B1626 100%);
      border-radius: 50%; border: 2px solid #000000;
      box-shadow: 0 0 10px rgba(0,0,0,0.9);
      z-index: 5;
    }

    .phena-caption {
      position: absolute; bottom: 25px;
      font-family: var(--font-heading); font-size: 0.85rem;
      letter-spacing: 3px; color: var(--gold-light); text-transform: uppercase;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
      animation: pulseText 1.8s ease-in-out infinite alternate;
      z-index: 10;
    }

    @keyframes spinPhenakistiscope {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulseText {
      from { opacity: 0.5; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1.04); }
    }


    /* ==========================================
       1. OVERLAY DEL SOBRE 3D
    ========================================== */
    #envelopeOverlay {
      position: fixed; inset: 0; z-index: 1000;
      background-image: linear-gradient(rgba(11, 22, 38, 0.8), rgba(11, 22, 38, 0.9)), url('fondo.png');
      background-size: cover; background-position: center; background-repeat: no-repeat;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 20px; 
      transition: transform 0.9s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease, visibility 0.8s ease;
    }
    #envelopeOverlay.zoom-in { transform: scale(1.35); }
    #envelopeOverlay.opened { opacity: 0; visibility: hidden; pointer-events: none; }

    .envelope-container {
      width: 100%; max-width: 420px; height: 280px;
      position: relative; perspective: 1000px; margin-top: 50px;
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .envelope-back {
      position: absolute; inset: 0;
      background-image: url('fondo.png'); background-size: cover; background-position: center;
      border-radius: 8px; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7); filter: brightness(0.7); z-index: 1;
    }

    .envelope-card-preview {
      position: absolute; inset: 12px;
      background-image: url('letter.jpg'); background-size: cover; background-position: center;
      display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px;
      z-index: 2; border-radius: 6px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transform: translateY(0); opacity: 0;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s ease;
      pointer-events: none;
    }
    .envelope-container.open .envelope-card-preview { transform: translateY(-110px); opacity: 1; }

    .envelope-pocket {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 180px;
      background-image: url('fondo.png'); background-size: cover; background-position: bottom;
      z-index: 3; border-radius: 0 0 8px 8px; box-shadow: inset 0 15px 15px -10px rgba(0, 0, 0, 0.6);
      filter: brightness(0.9); pointer-events: none;
      clip-path: polygon(0 0, 50% 35px, 100% 0, 100% 100%, 0 100%);
    }

    .envelope-flap {
      position: absolute; top: 0; left: 0; width: 100%; height: 150px;
      background-image: url('fondo.png'); background-size: cover; background-position: top;
      clip-path: polygon(0 0, 50% 100%, 100% 0); transform-origin: top;
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1); z-index: 4; filter: brightness(0.95); pointer-events: none;
    }
    .envelope-container.open .envelope-flap { transform: rotateX(180deg); z-index: 1; }

    .wax-seal-btn {
      position: absolute; top: 105px; left: 50%; transform: translateX(-50%);
      background-color: transparent; background-image: url('waxseal.png');
      background-size: cover; background-position: center; background-repeat: no-repeat;
      border: none; width: 105px; height: 105px; border-radius: 50%; cursor: pointer;
      display: flex; justify-content: center; align-items: center;
      filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.7)); z-index: 20;
      transition: transform 0.3s ease, opacity 0.4s ease;
    }
    .wax-seal-btn:hover { transform: translateX(-50%) scale(1.08); }
    .wax-seal-btn span {
      font-family: var(--font-heading); font-size: 0.7rem; letter-spacing: 2px;
      color: var(--gold-light); font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.9); pointer-events: none;
    }
    .envelope-container.open .wax-seal-btn { opacity: 0; pointer-events: none; }


    /* ==========================================
       2. CONTENIDO PRINCIPAL INVITACIÓN
    ========================================== */
    #mainInvitation { max-width: 680px; margin: 0 auto; padding: 40px 20px; display: none; }
    #mainInvitation.visible { display: block; }

    .section-card {
      background: #FFFFFF; border: 1px solid var(--border-gold); padding: 30px 20px; margin-bottom: 35px;
      border-radius: 4px; text-align: center; position: relative; box-shadow: 0 4px 20px rgba(11, 22, 38, 0.04);
      opacity: 0; transform: translateY(30px); transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .section-card.reveal { animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    .section-card:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(197, 160, 89, 0.15); }

    .header-names { font-family: var(--font-display); font-size: 2.2rem; color: var(--midnight); line-height: 1.2; margin-bottom: 10px; }
    .header-ampersand { font-family: var(--font-body); font-style: italic; color: var(--gold); display: block; font-size: 1.8rem; }
    .storybook-quote { font-style: italic; font-size: 1.15rem; color: var(--midnight-light); margin: 20px 0; line-height: 1.5; padding: 0 15px; }
    .event-date-large { font-family: var(--font-heading); font-size: 1.4rem; color: var(--midnight); letter-spacing: 1px; margin-top: 15px; font-weight: 600; }
    .event-time { font-family: var(--font-heading); font-size: 1rem; color: var(--gold); letter-spacing: 2px; }

    .timer-grid { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
    .timer-box { background: var(--bg-cream); border: 1px solid var(--border-gold); padding: 10px 12px; min-width: 65px; border-radius: 4px; }
    .timer-num { font-family: var(--font-heading); font-size: 1.3rem; color: var(--midnight); font-weight: 700; display: block; }
    .timer-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--gold); }

    .btn-gothic {
      display: inline-block; background: var(--midnight); color: var(--gold-light);
      border: 1px solid var(--gold); padding: 12px 24px; font-family: var(--font-heading);
      font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase; text-decoration: none;
      cursor: pointer; margin-top: 15px; border-radius: 2px; width: 100%; max-width: 300px;
      transition: background 0.3s ease, transform 0.2s ease;
    }
    .btn-gothic:hover { background: var(--midnight-light); color: #FFFFFF; transform: translateY(-2px); }
    .btn-secondary { background: transparent; color: var(--midnight); border: 1px solid var(--midnight); margin-top: 10px; }

    .form-group { text-align: left; margin-bottom: 20px; }
    .form-group label { display: block; font-family: var(--font-heading); font-size: 0.8rem; letter-spacing: 1px; color: var(--midnight); margin-bottom: 6px; text-transform: uppercase; }
    .form-control { width: 100%; padding: 10px 12px; border: 1px solid var(--border-gold); background: var(--bg-cream); font-family: var(--font-body); font-size: 1rem; color: var(--midnight); border-radius: 2px; outline: none; }
    .phone-row { display: flex; gap: 8px; }
    .phone-row select { width: 110px; }
    .guest-name-field { margin-top: 8px; animation: fadeInField 0.4s ease forwards; }
    @keyframes fadeInField { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

    .audio-recorder-box { background: var(--bg-cream); border: 1px dashed var(--gold); padding: 15px; border-radius: 4px; margin-top: 10px; text-align: center; }
    .rec-btn { background: var(--midnight); color: var(--gold); border: 1px solid var(--gold); padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; font-family: var(--font-heading); }
    .rec-btn.recording { background: #8a1c1c; color: #fff; }
    .notice-info { font-size: 0.8rem; color: var(--midnight-light); margin-top: 12px; font-style: italic; }
    #statusMessage { margin-top: 15px; font-weight: 600; font-size: 0.9rem; text-align: center; }
  </style
