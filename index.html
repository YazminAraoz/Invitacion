<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yazmín & Gonzalo - Save the Date</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@600;700&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg-cream: #FAF6EE;
      --midnight: #0B1626;
      --midnight-light: #182B45;
      --gold: #C5A059;
      --gold-light: #E0C078;
      --border-gold: rgba(197, 160, 89, 0.4);
      --font-display: 'Cinzel Decorative', serif;
      --font-heading: 'Cinzel', serif;
      --font-body: 'Cormorant Garamond', serif;
    }
    body {
      background-color: var(--bg-cream);
      color: var(--midnight);
      font-family: var(--font-body);
      font-size: 18px;
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
    }
    body.envelope-open { overflow-y: auto; }

    /* Pantalla Inicial con fondo.png y sombras 3D */
    #envelopeOverlay {
      position: fixed; inset: 0; z-index: 1000;
      background-image: linear-gradient(rgba(11, 22, 38, 0.8), rgba(11, 22, 38, 0.9)), url('fondo.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 20px; transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    #envelopeOverlay.opened { opacity: 0; visibility: hidden; pointer-events: none; }

    /* Estructura del Sobre 3D con Sombras Realistas */
    .envelope-container {
      width: 100%; max-width: 420px; height: 340px;
      background-image: url('fondo.png');
      background-size: cover;
      background-position: center;
      border: none;
      position: relative;
      box-shadow: 
        0 35px 70px rgba(0, 0, 0, 0.75), 
        0 15px 25px rgba(0, 0, 0, 0.5),
        inset 0 0 40px rgba(0, 0, 0, 0.4);
      border-radius: 8px;
      overflow: visible;
    }

    .envelope-container::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(0, 0, 0, 0.35) 100%);
      pointer-events: none;
      border-radius: 8px;
      z-index: 2;
    }

    .envelope-pocket {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 210px;
      background-image: url('fondo.png');
      background-size: cover;
      background-position: bottom;
      border-top: none;
      z-index: 2;
      border-radius: 0 0 8px 8px;
      box-shadow: inset 0 15px 15px -10px rgba(0, 0, 0, 0.6);
      filter: brightness(0.85);
      pointer-events: none;
    }

    .envelope-flap {
      position: absolute; top: 0; left: 0; width: 100%; height: 160px;
      background-image: url('fondo.png');
      background-size: cover;
      background-position: top;
      clip-path: polygon(0 0, 50% 100%, 100% 0);
      border-bottom: none;
      transform-origin: top;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 4;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
      filter: brightness(0.95);
      pointer-events: none;
    }
    .envelope-container.open .envelope-flap {
      transform: rotateX(180deg);
      z-index: 0;
      box-shadow: none;
    }

    /* Sello de Cera con waxseal.png transparente, sin bordes y más grande */
    .wax-seal-btn {
      position: absolute; top: 120px; left: 50%; transform: translateX(-50%);
      background-color: transparent;
      background-image: url('waxseal.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      border: none;
      width: 110px; height: 110px; 
      border-radius: 50%; 
      cursor: pointer;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.7));
      z-index: 10;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.3s ease;
    }
    .wax-seal-btn:hover { transform: translateX(-50%) scale(1.1); filter: drop-shadow(0 14px 20px rgba(0, 0, 0, 0.85)) brightness(1.1); }
    .wax-seal-btn span { display: none; } /* Oculto para que luzca totalmente limpio con tu PNG */

    /* Tarjeta interior utilizando letter.jpg como fondo */
    .envelope-card-preview {
      position: absolute; inset: 15px; 
      background-image: url('letter.jpg');
      background-size: cover;
      background-position: center;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center; padding: 25px;
      z-index: 1; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      border-radius: 4px;
      pointer-events: none;
    }
    .envelope-container.open .envelope-card-preview {
      transform: translateY(-55px);
      z-index: 3;
    }

    /* Contenido Principal de la Invitación */
    #mainInvitation { max-width: 680px; margin: 0 auto; padding: 40px 20px; display: none; }
    #mainInvitation.visible { display: block; }

    .section-card {
      background: #FFFFFF; border: 1px solid var(--border-gold);
      padding: 30px 20px; margin-bottom: 35px; border-radius: 4px; text-align: center; position: relative;
      box-shadow: 0 4px 20px rgba(11, 22, 38, 0.04);
      opacity: 0; transform: translateY(30px);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .section-card.reveal {
      animation: fadeInUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    .section-card:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(197, 160, 89, 0.15); }

    .header-names { font-family: var(--font-display); font-size: 2.2rem; color: var(--midnight); line-height: 1.2; margin-bottom: 10px; }
    .header-ampersand { font-family: var(--font-body); font-style: italic; color: var(--gold); display: block; font-size: 1.8rem; }
    .storybook-quote { font-style: italic; font-size: 1.15rem; color: var(--midnight-light); margin: 20px 0; line-height: 1.5; padding: 0 15px; }
    .event-date-large { font-family: var(--font-heading); font-size: 1.4rem; color: var(--midnight); letter-spacing: 1px; margin-top: 15px; font-weight: 600; }
    .event-time { font-family: var(--font-heading); font-size: 1rem; color: var(--gold); letter-spacing: 2px; }

    .timer-grid { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
    .timer-box { background: var(--bg-cream); border: 1px solid var(--border-gold); padding: 10px 12px; min-width: 65px; border-radius: 4px; }
    .timer-num { font-family: var(--font-heading); font-size: 1.3rem; color: var(--midnight); font-weight: 700; display: block; }
    .timer-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--gold); }

    .btn-gothic {
      display: inline-block; background: var(--midnight); color: var(--gold-light);
      border: 1px solid var(--gold); padding: 12px 24px; font-family: var(--font-heading);
      font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase; text-decoration: none;
      cursor: pointer; margin-top: 15px; border-radius: 2px; width: 100%; max-width: 300px;
      transition: background 0.3s ease, transform 0.2s ease;
    }
    .btn-gothic:hover { background: var(--midnight-light); color: #FFFFFF; transform: translateY(-2px); }
    .btn-secondary { background: transparent; color: var(--midnight); border: 1px solid var(--midnight); margin-top: 10px; }

    .form-group { text-align: left; margin-bottom: 20px; }
    .form-group label { display: block; font-family: var(--font-heading); font-size: 0.8rem; letter-spacing: 1px; color: var(--midnight); margin-bottom: 6px; text-transform: uppercase; }
    .form-control { width: 100%; padding: 10px 12px; border: 1px solid var(--border-gold); background: var(--bg-cream); font-family: var(--font-body); font-size: 1rem; color: var(--midnight); border-radius: 2px; outline: none; }
    .phone-row { display: flex; gap: 8px; }
    .phone-row select { width: 110px; }
    .guest-name-field { margin-top: 8px; animation: fadeInField 0.4s ease forwards; }
    @keyframes fadeInField { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

    .audio-recorder-box { background: var(--bg-cream); border: 1px dashed var(--gold); padding: 15px; border-radius: 4px; margin-top: 10px; text-align: center; }
    .rec-btn { background: var(--midnight); color: var(--gold); border: 1px solid var(--gold); padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; font-family: var(--font-heading); }
    .rec-btn.recording { background: #8a1c1c; color: #fff; }
    .notice-info { font-size: 0.8rem; color: var(--midnight-light); margin-top: 12px; font-style: italic; }
    #statusMessage { margin-top: 15px; font-weight: 600; font-size: 0.9rem; text-align: center; }
  </style>
</head>
<body>

  <!-- Pantalla Inicial con fondo.png y la tarjeta interior con letter.jpg -->
  <div id="envelopeOverlay">
    <div class="envelope-container" id="envelopeBox">
      <div class="envelope-flap"></div>
      
      <!-- Tarjeta interior con el fondo letter.jpg -->
      <div class="envelope-card-preview">
        <p style="font-family: var(--font-heading); font-size: 0.75rem; letter-spacing: 2px; color: #4a121a; font-weight: bold; margin-bottom: 5px;">ESTÁS INVITADO A LA BODA DE</p>
        <h3 style="font-family: var(--font-display); font-size: 1.25rem; color: var(--midnight); text-shadow: 0 1px 1px rgba(255,255,255,0.6);">Yazmín & Gonzalo</h3>
      </div>

      <div class="envelope-pocket"></div>
      
      <!-- Sello de Cera con waxseal.png transparente -->
      <button class="wax-seal-btn" onclick="openEnvelope()">
        <span>ABRIR</span>
      </button>
    </div>
  </div>

  <!-- Contenido Principal con Tarjetas en Cascada -->
  <main id="mainInvitation">
    
    <!-- Tarjeta 1: Presentación y Cita de Poe -->
    <section class="section-card">
      <div class="header-names">Yazmín <span class="header-ampersand">y</span> Gonzalo</div>
      <p class="storybook-quote">"Y la amaba con un amor que era más que el amor..." <br><span style="font-size:0.9rem; letter-spacing:1px; color:var(--gold);">— Edgar Allan Poe (Anabel Lee)</span></p>
      <div class="event-date-large">4 DE SEPTIEMBRE DE 2027</div>
      <div class="event-time">12:45 HS</div>
      <div class="timer-grid">
        <div class="timer-box"><span class="timer-num" id="dias">00</span><span class="timer-label">Días</span></div>
        <div class="timer-box"><span class="timer-num" id="horas">00</span><span class="timer-label">Hs</span></div>
        <div class="timer-box"><span class="timer-num" id="minutos">00</span><span class="timer-label">Min</span></div>
        <div class="timer-box"><span class="timer-num" id="segundos">00</span><span class="timer-label">Seg</span></div>
      </div>
    </section>

    <!-- Tarjeta 2: Ubicación -->
    <section class="section-card">
      <h2 style="font-family: var(--font-heading); font-size: 1.2rem
