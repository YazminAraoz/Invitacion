<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ingreso · Yazmin & Gonzalo</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--mid:#0B1626;--mid2:#182B45;--gold:#C5A059;--gold2:#E0C078;--parch:#F4EAD5;--ink:#120E0C;--ok:#6FBF8B;--warn:#E0A84A;--bad:#D9695F;
--h:'Cinzel',serif;--b:'Cormorant Garamond',serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--mid);color:var(--parch);font:500 19px/1.4 var(--b);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid rgba(197,160,89,.35)}
header h1{font:700 1rem/1 var(--h);letter-spacing:2px;color:var(--gold2)}
header span{font-size:.95rem;opacity:.8}
main{flex:1;display:flex;flex-direction:column;gap:14px;padding:16px 18px;overflow-y:auto;max-width:560px;width:100%;margin:0 auto}
.hide{display:none!important}
.view{position:relative;aspect-ratio:1;min-height:260px;width:100%;background:#000;border:1px solid var(--gold);border-radius:6px;overflow:hidden;isolation:isolate}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.diag{font-size:.85rem;opacity:.7;text-align:center}
.frame{position:absolute;inset:18%;border:2px solid var(--gold2);border-radius:10px;pointer-events:none}
.msg{text-align:center;opacity:.85}
input,button,select{font:inherit;border-radius:4px}
input{width:100%;padding:12px;background:var(--mid2);border:1px solid rgba(197,160,89,.5);color:var(--parch)}
input:focus,button:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.row{display:flex;gap:10px}
button{padding:13px 16px;border:1px solid var(--gold);background:transparent;color:var(--gold2);font:700 .85rem var(--h);letter-spacing:1.5px;cursor:pointer}
button.main{background:var(--gold);color:var(--ink)}
button:disabled{opacity:.5}
.ficha{background:var(--parch);color:var(--ink);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:12px;border-top:6px solid var(--warn)}
.ficha.ok{border-color:var(--ok)}.ficha.bad{border-color:var(--bad)}
.ficha .st{font:700 .8rem var(--h);letter-spacing:1.5px}
.ficha h2{font:700 1.7rem/1.1 var(--h)}
.mesa{display:flex;align-items:baseline;gap:12px;padding:10px 0;border-block:1px solid rgba(18,14,12,.25)}
.mesa b{font:700 4rem/1 var(--h);color:#4a121a}
.mesa input{background:#fff;color:var(--ink);border-color:#4a121a;width:110px;font:700 1.6rem var(--h);text-align:center}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px}dt{opacity:.65}dd{font-weight:700}
.tools{display:flex;gap:10px;flex-wrap:wrap}.tools button{flex:1;font-size:.7rem}
label{display:block;margin:8px 0 4px;opacity:.85}
</style>
</head>
<body>
<header><h1>INGRESO</h1><span id="count">0 ingresos</span></header>
<main>
  <!-- Configuración -->
  <section id="setup" class="hide">
    <p class="msg">Elegí cómo conectar la lista de invitados.</p>
    <label>Opción A · Cargar el Excel o CSV de la planilla (Archivo &gt; Descargar)</label>
    <button class="main" style="width:100%" onclick="$('listFile').click()">CARGAR LISTA EXCEL / CSV</button>
    <input id="listFile" type="file" accept=".xlsx,.xls,.csv" class="hide" onchange="loadList(this)">
    <label style="margin-top:18px">Opción B · Conexión en línea (Apps Script)</label>
    <input id="url" placeholder="https://script.google.com/macros/s/…/exec">
    <input id="pin" type="password" placeholder="PIN del personal" style="margin-top:8px">
    <button style="margin-top:10px;width:100%" onclick="saveCfg()">GUARDAR CONEXIÓN</button>
    <button style="margin-top:10px;width:100%" onclick="next()">VOLVER AL ESCÁNER</button>
  </section>

  <!-- Escáner -->
  <section id="scan" class="hide" style="display:flex;flex-direction:column;gap:14px">
    <div class="view"><video id="vid" playsinline muted></video><div class="frame"></div></div>
    <p class="msg" id="hint">Apuntá la cámara al QR del pase.</p>
    <div class="row"><button onclick="startCam()">ACTIVAR CÁMARA</button><button id="photoBtn" onclick="$('photo').click()">LEER DESDE FOTO</button></div>
    <input id="photo" type="file" accept="image/*" capture="environment" class="hide" onchange="readPhoto(this)">
    <div class="row"><input id="manual" placeholder="Código manual (YG-XXXXXXXXXX)" autocapitalize="characters" onkeydown="if(event.key==='Enter')handleQR(this.value)"><button onclick="handleQR(manual.value)">BUSCAR</button></div>
    <p class="diag" id="diag"></p>
    <p class="diag" id="diag2"></p>
    <div class="tools">
      <button onclick="exportLog()">EXCEL: INGRESOS</button>
      <button onclick="exportAll()">EXCEL: LISTA Y MESAS</button>
      <button onclick="resetCfg()">AJUSTES</button>
    </div>
  </section>

  <!-- Ficha de invitado -->
  <section id="card" class="hide" style="display:flex;flex-direction:column;gap:14px"></section>
</main>

<script>
const API_URL = "";  // opcional: URL de la Web App de Apps Script
const $ = id => document.getElementById(id);
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
let cfg = { url: API_URL || store.get('esc_url') || '', pin: store.get('esc_pin') || '' };
let log = JSON.parse(store.get('esc_log') || '[]');
let list = JSON.parse(store.get('esc_list') || '[]');
let scanning = false, stream = null, current = null;
const show = id => ['setup','scan','card'].forEach(s => $(s).classList.toggle('hide', s !== id));
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nrm = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const fmt = d => { const t = new Date(d); return isNaN(t) ? String(d) : t.toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); };
const online = () => !!(cfg.url && cfg.pin);
const refreshCount = () => { $('count').textContent = log.length + (log.length === 1 ? ' ingreso' : ' ingresos');
  $('diag').textContent = 'Lector QR: ' + (window.jsQR ? 'ok' : 'NO cargó') + ' · Excel: ' + (window.XLSX ? 'ok' : 'NO cargó') + ' · Lista: ' + (online() ? 'en línea' : list.length ? 'local (' + list.length + ' invitados)' : 'sin cargar (usa datos del QR)'); };

function saveCfg(){
  cfg.url = $('url').value.trim(); cfg.pin = $('pin').value.trim();
  if (!cfg.url || !cfg.pin) return alert('Completá la URL y el PIN.');
  store.set('esc_url', cfg.url); store.set('esc_pin', cfg.pin); next();
}
function resetCfg(){ stopCam(); $('url').value = cfg.url; show('setup'); }

function loadList(inp){
  const f = inp.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const wb = XLSX.read(new Uint8Array(rd.result), { type: 'array' });
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
      list = rows.map(r => { const o = {}; Object.keys(r).forEach(k => o[nrm(k)] = r[k]); return {
        codigo: String(o['codigo unico del pase'] || '').trim(), qr: String(o['contenido del qr'] || ''), nombre: o['nombre'],
        asistencia: o['asistencia'], acompanantes: o['acompanantes'], nombresAcompanantes: o['nombres acompanantes'],
        telefono: o['telefono'], restricciones: o['restricciones'], comentarios: o['comentarios'], mesa: o['numero de mesa'], checkin: o['check-in'] || '' }; })
        .filter(g => g.nombre || g.codigo);
      store.set('esc_list', JSON.stringify(list)); refreshCount();
      alert('Lista cargada: ' + list.length + ' invitados.' + (list.some(g => g.codigo || g.qr) ? '' : ' Atención: no encontré códigos en la planilla; se usarán los datos del QR.'));
      next();
    } catch (e) { alert('No se pudo leer el archivo: ' + e.message); }
    inp.value = '';
  };
  rd.readAsArrayBuffer(f);
}
const findLocal = code => list.find(g => g.codigo.toUpperCase() === code) || list.find(g => g.qr && g.qr.toUpperCase().includes(code));

async function api(params, body){
  if (body) return (await fetch(cfg.url, { method:'POST', body: JSON.stringify({ ...body, pin: cfg.pin }) })).json();
  const u = new URL(cfg.url);
  Object.entries({ ...params, pin: cfg.pin }).forEach(([k,v]) => u.searchParams.set(k, v));
  return (await fetch(u)).json();
}

const VERSION = 'v3';
function whyNoCam(){
  const ua = navigator.userAgent;
  if (window.isSecureContext === false) return 'La página no está en una conexión segura (HTTPS).';
  if (window.top !== window.self) return 'La página está incrustada dentro de otra (iframe/embed) y el navegador bloquea la cámara. Abrí el enlace del escáner directo, en su propia pestaña.';
  if (/FBAN|FBAV|Instagram|WhatsApp|Messenger|Snapchat|TikTok|Line\/|; wv\)|GSA\//i.test(ua)) return 'Estás en el navegador interno de otra app (WhatsApp, Instagram, etc.), que bloquea la cámara. Copiá el enlace y abrilo en Chrome o Safari.';
  const pp = document.permissionsPolicy || document.featurePolicy;
  if (pp && pp.allowsFeature && !pp.allowsFeature('camera')) return 'Tu sitio bloquea la cámara con un encabezado Permissions-Policy. En el hosting hay que permitir camera=(self).';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return 'Este navegador no ofrece acceso a la cámara.';
  return '';
}
function camFail(msg){
  $('hint').textContent = msg + ' Mientras tanto usá "Leer desde foto" o escribí el código.';
  $('hint').style.color = 'var(--warn)'; $('photoBtn').classList.add('main');
}
async function startCam(){
  stopCam(); $('hint').style.color = ''; $('photoBtn').classList.remove('main');
  if (!window.jsQR) return camFail('No cargó el lector de QR (revisá internet o si tu sitio bloquea cdnjs.cloudflare.com).');
  const why = whyNoCam(); if (why) return camFail(why);
  const gum = c => navigator.mediaDevices.getUserMedia(c);
  try {
    try { stream = await gum({ video: { facingMode: { ideal: 'environment' } }, audio: false }); }
    catch (e) { if (e.name === 'OverconstrainedError' || e.name === 'NotFoundError') stream = await gum({ video: true, audio: false }); else throw e; }
    const v = $('vid'); v.srcObject = stream; await v.play();
    scanning = true; $('hint').textContent = 'Apuntá la cámara al QR del pase.'; tick();
  } catch (e) {
    const m = { NotAllowedError: 'El permiso de cámara está bloqueado para este sitio. Tocá el candado junto a la dirección > Permisos > Cámara > Permitir, y recargá.',
      NotFoundError: 'No se encontró ninguna cámara en este dispositivo.', NotReadableError: 'La cámara está siendo usada por otra app. Cerrala e intentá de nuevo.',
      SecurityError: 'El navegador o el hosting bloquea el acceso a la cámara.' };
    camFail(m[e.name] || ('Error de cámara: ' + e.name + (e.message ? ' – ' + e.message : '') + '.'));
  }
}
async function techDiag(){
  let perm = '?'; try { perm = (await navigator.permissions.query({ name: 'camera' })).state; } catch (e) {}
  $('diag2').textContent = VERSION + ' · HTTPS: ' + (window.isSecureContext === false ? 'no' : 'sí') + ' · incrustada: ' + (window.top !== window.self ? 'sí' : 'no') + ' · permiso cámara: ' + perm;
}
function stopCam(){ scanning = false; if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; }

const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
function decode(src, w, h){
  const k = Math.min(1, 900 / Math.max(w, h)); cv.width = Math.round(w * k); cv.height = Math.round(h * k);
  cx.drawImage(src, 0, 0, cv.width, cv.height);
  const d = cx.getImageData(0, 0, cv.width, cv.height);
  return jsQR(d.data, d.width, d.height, { inversionAttempts: 'attemptBoth' });
}
function tick(){
  if (!scanning) return;
  const v = $('vid');
  if (v.readyState >= 2 && v.videoWidth) {
    const q = decode(v, v.videoWidth, v.videoHeight);
    if (q && q.data) { scanning = false; navigator.vibrate && navigator.vibrate(80); return handleQR(q.data); }
  }
  setTimeout(() => requestAnimationFrame(tick), 80);
}
function readPhoto(inp){
  const f = inp.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const q = decode(img, img.naturalWidth, img.naturalHeight); inp.value = '';
    if (q && q.data) handleQR(q.data); else $('hint').textContent = 'No se encontró un QR en esa foto. Probá de nuevo más cerca y con buena luz.';
  };
  img.src = URL.createObjectURL(f);
}

function handleQR(raw){
  let data = null, code = '';
  try { data = JSON.parse(raw); code = data.codigo; } catch (e) {}
  if (!code) { const m = raw.match(/YG-[A-Z0-9]+/i); code = m ? m[0] : raw.trim(); }
  lookup(code, data);
}

async function lookup(code, qrData){
  code = String(code || '').trim().toUpperCase(); if (!code) return;
  stopCam(); $('hint').textContent = 'Buscando…';
  let g = null, warn = '';
  if (online()) {
    try { const r = await api({ action: 'guest', code }); if (r.ok) g = r.guest; else warn = r.error; }
    catch (e) { warn = 'Sin conexión con la planilla; se usan los datos locales.'; }
  }
  if (!g) g = findLocal(code);
  if (!g && qrData) g = { codigo: code, nombre: qrData.invitado, asistencia: qrData.asistencia, acompanantes: qrData.acompanantes, mesa: '', checkin: '', fromQR: true };
  if (!g) return renderError(warn || 'Código no encontrado. Cargá la lista en Ajustes.', code);
  renderCard(g, warn);
}

function renderError(msg, code){
  $('card').innerHTML = `<div class="ficha bad"><span class="st">PASE NO VÁLIDO</span><h2>${esc(msg)}</h2><p>Código leído: ${esc(code)}</p></div>
  <button class="main" onclick="next()">ESCANEAR OTRO</button>`;
  show('card');
}

function renderCard(g, warn){
  current = g;
  const attends = /^s/i.test(String(g.asistencia).trim());
  const already = !!g.checkin || log.some(l => l['Código'] === g.codigo);
  const cls = !attends ? 'bad' : already ? '' : 'ok';
  const st = !attends ? 'NO CONFIRMÓ ASISTENCIA' : already ? 'YA INGRESÓ' + (g.checkin ? ' · ' + fmt(g.checkin) : '') : g.fromQR ? 'PASE VÁLIDO · SIN LISTA CARGADA' : 'EN LA LISTA · PRIMER INGRESO';
  const mesa = g.mesa !== '' && g.mesa != null
    ? `<b>${esc(g.mesa)}</b>`
    : `<input id="mesaIn" type="number" min="1" inputmode="numeric" placeholder="Nº"><span>Sin mesa asignada. Elegí una.</span>`;
  $('card').innerHTML = `<div class="ficha ${cls}">
    <span class="st">${esc(st)}</span><h2>${esc(g.nombre)}</h2>
    <div class="mesa"><span>Mesa</span>${mesa}</div>
    <dl><dt>Acompañantes</dt><dd>${esc(g.acompanantes ?? 0)}</dd>
    ${g.nombresAcompanantes && g.nombresAcompanantes !== '-' ? `<dt>Nombres</dt><dd>${esc(g.nombresAcompanantes)}</dd>` : ''}
    ${g.fromQR ? '' : `<dt>Restricciones</dt><dd>${esc(g.restricciones || 'Ninguna')}</dd><dt>Teléfono</dt><dd>${esc(g.telefono || '-')}</dd>`}
    ${g.comentarios && g.comentarios !== '-' ? `<dt>Comentarios</dt><dd>${esc(g.comentarios)}</dd>` : ''}
    <dt>Código</dt><dd>${esc(g.codigo)}</dd></dl>${warn ? `<p>${esc(warn)}</p>` : ''}</div>
  <button class="main" id="okBtn" onclick="confirmEntry()">${already ? 'GUARDAR MESA Y VOLVER' : 'REGISTRAR INGRESO'}</button>
  <button onclick="next()">CANCELAR</button>`;
  show('card');
}

async function confirmEntry(){
  const g = current, btn = $('okBtn'), inp = $('mesaIn');
  const mesa = inp ? inp.value.trim() : '';
  if (inp && !mesa) return alert('Asigná un número de mesa antes de registrar.');
  btn.disabled = true; btn.textContent = 'GUARDANDO…';
  const first = !g.checkin && !log.some(l => l['Código'] === g.codigo);
  let warn = '';
  if (online() && !g.fromQR) {
    try { const r = await api(null, { action: 'update', code: g.codigo, mesa, checkin: true }); if (!r.ok) throw new Error(r.error); g.mesa = r.guest.mesa; }
    catch (e) { warn = 'No se pudo escribir en la planilla (' + e.message + '). Quedó guardado en este dispositivo.'; if (mesa) g.mesa = mesa; }
  } else if (mesa) g.mesa = mesa;
  g.checkin = g.checkin || new Date().toISOString();
  const loc = findLocal(g.codigo); if (loc) { loc.mesa = g.mesa; loc.checkin = g.checkin; store.set('esc_list', JSON.stringify(list)); }
  if (first) { log.push({ Hora: new Date().toLocaleString('es-AR'), 'Código': g.codigo, Nombre: g.nombre, Asistencia: g.asistencia,
    'Acompañantes': g.acompanantes, 'Nombres acompañantes': g.nombresAcompanantes || '', Restricciones: g.restricciones || '', Mesa: g.mesa });
    store.set('esc_log', JSON.stringify(log)); }
  if (warn) alert(warn);
  next();
}

function next(){ $('manual').value = ''; refreshCount(); show('scan'); startCam(); }

function download(rows, name){
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Invitados');
  XLSX.writeFile(wb, name + '.xlsx');
}
function exportLog(){ if (!log.length) return alert('Todavía no hay ingresos registrados en este dispositivo.'); download(log, 'ingresos-boda'); }
async function exportAll(){
  let gs = list;
  if (online()) { try { const r = await api({ action: 'list' }); if (r.ok) gs = r.guests; } catch (e) {} }
  if (!gs.length) return alert('No hay lista cargada. Cargá el Excel o conectá la planilla en Ajustes.');
  download(gs.map(g => ({ Nombre: g.nombre, Asistencia: g.asistencia, 'Acompañantes': g.acompanantes, 'Nombres acompañantes': g.nombresAcompanantes,
    Restricciones: g.restricciones, 'Teléfono': g.telefono, Mesa: g.mesa, 'Código': g.codigo, 'Check-in': g.checkin })), 'lista-con-mesas');
}

refreshCount(); techDiag(); next();
</script>
</body>
</html>
